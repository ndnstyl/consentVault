<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" role="img" aria-label="ConsentVault.AI architecture: capture widget, edge worker, signed API, append-only ledger, seals and anchors, then gate, proof and evidence bundle"><title>ConsentVault.AI architecture: capture widget, edge worker, signed API, append-only ledger, seals and anchors, then gate, proof and evidence bundle</title><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#C6B25D"/></marker></defs><rect width="960" height="430" rx="16" fill="#131C25"/><rect x="1" y="1" width="958" height="428" rx="16" fill="none" stroke="#2E3C4A" stroke-width="2"/><text x="16" y="34" font-family="Montserrat, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="800" font-size="12" letter-spacing="2" fill="#D5C47B">HOW A CONSENT BECOMES EVIDENCE</text><rect x="16" y="56" width="190" height="84" rx="12" fill="#1B2632" stroke="#2E3C4A" stroke-width="1.5"/><text x="111.0" y="92" text-anchor="middle" font-family="Montserrat, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="700" font-size="16" fill="#E6ECF1">Capture widget</text><text x="111.0" y="116" text-anchor="middle" font-family="Montserrat, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="500" font-size="12.5" fill="#B3BEC8">Hashes the wording shown</text><line x1="210" y1="98.0" x2="258" y2="98.0" stroke="#C6B25D" stroke-width="2" marker-end="url(#ar)"/><rect x="262" y="56" width="190" height="84" rx="12" fill="#1B2632" stroke="#2E3C4A" stroke-width="1.5"/><text x="357.0" y="92" text-anchor="middle" font-family="Montserrat, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="700" font-size="16" fill="#E6ECF1">Edge worker</text><text x="357.0" y="116" text-anchor="middle" font-family="Montserrat, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="500" font-size="12.5" fill="#B3BEC8">Adds time and IP, signs</text><line x1="456" y1="98.0" x2="504" y2="98.0" stroke="#C6B25D" stroke-width="2" marker-end="url(#ar)"/><rect x="508" y="56" width="190" height="84" rx="12" fill="#1B2632" stroke="#2E3C4A" stroke-width="1.5"/><text x="603.0" y="92" text-anchor="middle" font-family="Montserrat, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="700" font-size="16" fill="#E6ECF1">Signed API</text><text x="603.0" y="116" text-anchor="middle" font-family="Montserrat, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="500" font-size="12.5" fill="#B3BEC8">HMAC check, then record</text><line x1="702" y1="98.0" x2="750" y2="98.0" stroke="#C6B25D" stroke-width="2" marker-end="url(#ar)"/><rect x="754" y="56" width="190" height="84" rx="12" fill="#1B2632" stroke="#C6B25D" stroke-width="2"/><text x="849.0" y="92" text-anchor="middle" font-family="Montserrat, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="700" font-size="16" fill="#E6ECF1">Append-only ledger</text><text x="849.0" y="116" text-anchor="middle" font-family="Montserrat, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="500" font-size="12.5" fill="#B3BEC8">Hash-chained events</text><rect x="744" y="172" width="210" height="124" rx="14" fill="none" stroke="#C6B25D" stroke-width="1.5" stroke-dasharray="6 5"/><text x="849.0" y="286" text-anchor="middle" font-family="Montserrat, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="800" font-size="10.5" letter-spacing="1.6" fill="#D5C47B">OUTSIDE YOUR COMPANY</text><rect x="754" y="186" width="190" height="84" rx="12" fill="#1B2632" stroke="#2E3C4A" stroke-width="1.5"/><text x="849.0" y="222" text-anchor="middle" font-family="Montserrat, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="700" font-size="16" fill="#E6ECF1">Seals and anchors</text><text x="849.0" y="246" text-anchor="middle" font-family="Montserrat, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="500" font-size="12.5" fill="#B3BEC8">RFC 3161 and chain head</text><line x1="849.0" y1="144" x2="849.0" y2="168" stroke="#C6B25D" stroke-width="2" marker-end="url(#ar)"/><rect x="16" y="172" width="682" height="124" rx="12" fill="#1B2632" stroke="#2E3C4A" stroke-width="1.5"/><text x="36" y="200" font-family="Montserrat, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="700" font-size="13.5" fill="#E6ECF1">Why tampering shows</text><text x="36" y="226" font-family="Montserrat, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="500" font-size="13" fill="#B3BEC8">The runtime role can read and append only; a trigger refuses UPDATE and DELETE.</text><text x="36" y="248" font-family="Montserrat, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="500" font-size="13" fill="#B3BEC8">Only a 32-byte digest leaves your host for the timestamp authority.</text><text x="36" y="270" font-family="Montserrat, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="500" font-size="13" fill="#B3BEC8">The chain head is anchored to a sink your database host cannot rewrite.</text><line x1="849.0" y1="296" x2="849.0" y2="308" stroke="#C6B25D" stroke-width="2"/><line x1="357.0" y1="308" x2="849.0" y2="308" stroke="#C6B25D" stroke-width="2"/><line x1="357.0" y1="308" x2="357.0" y2="326" stroke="#C6B25D" stroke-width="2" marker-end="url(#ar)"/><rect x="262" y="330" width="190" height="84" rx="12" fill="#1B2632" stroke="#2E3C4A" stroke-width="1.5"/><text x="357.0" y="366" text-anchor="middle" font-family="Montserrat, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="700" font-size="16" fill="#E6ECF1">Gate</text><text x="357.0" y="390" text-anchor="middle" font-family="Montserrat, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="500" font-size="12.5" fill="#B3BEC8">May we contact? Yes or no</text><line x1="603.0" y1="308" x2="603.0" y2="326" stroke="#C6B25D" stroke-width="2" marker-end="url(#ar)"/><rect x="508" y="330" width="190" height="84" rx="12" fill="#1B2632" stroke="#2E3C4A" stroke-width="1.5"/><text x="603.0" y="366" text-anchor="middle" font-family="Montserrat, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="700" font-size="16" fill="#E6ECF1">Proof</text><text x="603.0" y="390" text-anchor="middle" font-family="Montserrat, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="500" font-size="12.5" fill="#B3BEC8">Timeline of grants, stops</text><line x1="849.0" y1="308" x2="849.0" y2="326" stroke="#C6B25D" stroke-width="2" marker-end="url(#ar)"/><rect x="754" y="330" width="190" height="84" rx="12" fill="#1B2632" stroke="#C6B25D" stroke-width="2"/><text x="849.0" y="366" text-anchor="middle" font-family="Montserrat, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="700" font-size="16" fill="#E6ECF1">Evidence bundle</text><text x="849.0" y="390" text-anchor="middle" font-family="Montserrat, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="500" font-size="12.5" fill="#B3BEC8">Self-verifying, offline</text><text x="16" y="358.0" font-family="Montserrat, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="700" font-size="14" fill="#E6ECF1">What you hand over</text><text x="16" y="378.0" font-family="Montserrat, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="500" font-size="12.5" fill="#B3BEC8">A regulator or a court</text><text x="16" y="398.0" font-family="Montserrat, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="500" font-size="12.5" fill="#B3BEC8">can check on their own.</text></svg>
