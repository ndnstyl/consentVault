<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="ConsentVault.AI: proof of consent that holds up"><title>ConsentVault.AI: proof of consent that holds up</title><rect width="1280" height="640" fill="#131C25"/><rect x="0" y="0" width="1280" height="8" fill="#C6B25D"/><g transform="translate(80 72) scale(2.0)"><rect width="32" height="32" rx="7" fill="#2A3845"/><circle cx="16" cy="16" r="11" fill="none" stroke="#fff" stroke-width="2" opacity=".85"/><rect x="12.5" y="12.5" width="7" height="7" rx="1.3" transform="rotate(45 16 16)" fill="#C6B25D"/></g><text x="164.48" y="116.16" font-family="Montserrat, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="700" font-size="39.68" letter-spacing="1.6"><tspan fill="#FFFFFF">CONSENT</tspan><tspan fill="#D5C47B">VAULT</tspan><tspan fill="#FFFFFF" opacity=".75">.AI</tspan></text><text x="80" y="262" font-family="Montserrat, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="700" font-size="58" fill="#E6ECF1">Proof of consent</text><text x="80" y="334" font-family="Montserrat, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="700" font-size="58" fill="#E6ECF1">that <tspan font-family="'Cormorant Garamond', Georgia, 'Times New Roman', serif" font-style="italic" font-weight="600" font-size="68" fill="#D5C47B">holds up.</tspan></text><text x="80" y="396" font-family="Montserrat, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="500" font-size="22" fill="#B3BEC8">The exact words, the exact moment, sealed by</text><text x="80" y="428" font-family="Montserrat, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="500" font-size="22" fill="#B3BEC8">someone outside your company.</text><rect x="80" y="500" width="202" height="36" rx="18" fill="none" stroke="#C6B25D" stroke-width="1.5"/><text x="181.0" y="523" text-anchor="middle" font-family="Montserrat, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="700" font-size="14" fill="#D5C47B">Append-only ledg