name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: PostgreSQL server binaries (the tests start their own throwaway server)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-16 openssl
      - run: pip install -e .[dev]
      - run: pytest -m "not network"
        env:
          PG_BIN: /usr/lib/postgresql/16/bin
          TWENTY_CONFORMANCE_WALKS: "120"  # the Twenty model conformance, its model kept in tests/connectors/twenty/model

  suites:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        suite: [isolation, sync, providers]
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"
      - name: PostgreSQL server binaries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-16 openssl
      - run: pip install -e .[dev]
      - name: Run tests/${{ matrix.suite }} when the folder exists
        env:
          PG_BIN: /usr/lib/postgresql/16/bin
        run: |
          if [ -d "tests/${{ matrix.suite }}" ]; then
            pytest "tests/${{ matrix.suite }}" -m "not network"
          else
            echo "tests/${{ matrix.suite }} does not exist yet: nothing to run"
          fi

  edge:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: "24.0.0"
      - run: npm test
        working-directory: edge

  pip-audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"
      - run: pip install pip-audit==2.10.1 -e .[cloud]
      - run: pip-audit --local --strict

  gitleaks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  security-gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: "24.0.0"
      - name: Security gate (static analysis, npm and pip audits, secret scan, infrastructure and image scans)
        env:
          CV_GATE_STRICT: "1"
          SECURITY_GATE_STEPS: allowlist,suppressions,sast,npm-audit,pip-audit,secrets,iac,image
        run: bash scripts/security_gate.sh
