name: ci

on:
  push:
    branches: [main, demo-live]   # demo-live is the branch the cloud service is built from
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: PostgreSQL server binaries (the tests start their own throwaway server)
        run: sudo install -d /usr/share/postgresql-common/pgdg && sudo curl -fsSLo /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc && echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list && sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-17 postgresql-17-pgaudit openssl   # production runs 17 and the security manifest is built on 17
      - run: pip install -e .[dev]
      - run: pytest -m "not network and not slow"   # deselected tests are counted in the summary line
        env:
          PG_BIN: /usr/lib/postgresql/17/bin
          TWENTY_CONFORMANCE_WALKS: "120"  # the Twenty model conformance, its model kept in tests/connectors/twenty/model

  suites:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        suite: [isolation, sync, providers]
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"
      - name: PostgreSQL server binaries
        run: sudo install -d /usr/share/postgresql-common/pgdg && sudo curl -fsSLo /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc && echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list && sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-17 postgresql-17-pgaudit openssl   # production runs 17 and the security manifest is built on 17
      - run: pip install -e .[dev]
      - name: Run tests/${{ matrix.suite }} when the folder exists
        env:
          PG_BIN: /usr/lib/postgresql/17/bin
        run: |
          if [ -d "tests/${{ matrix.suite }}" ]; then
            pytest "tests/${{ matrix.suite }}" -m "not network"
          else
            echo "tests/${{ matrix.suite }} does not exist yet: nothing to run"
          fi

  edge:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: "24.0.0"
      - run: npm test
        working-directory: edge

  pip-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"
      - run: pip install pip-audit==2.10.1 -e .[cloud]
      # every installed dependency, audited from a frozen list: the product itself is not on PyPI, so it is left out by name
      - run: pip freeze --exclude-editable | grep -v "^consentvault" > audit-requirements.txt && pip-audit --strict --disable-pip --no-deps -r audit-requirements.txt

  gitleaks:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  security-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: "24.0.0"
      - name: Security gate (static analysis, npm and pip audits, secret scan, infrastructure and image scans)
        env:
          CV_GATE_STRICT: "1"
          SECURITY_GATE_STEPS: allowlist,suppressions,sast,npm-audit,pip-audit,secrets,iac,image
        run: bash scripts/security_gate.sh
