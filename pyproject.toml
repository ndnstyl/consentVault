[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "consentvault"
authors = [{ name = "The Innovative Native LLC" }]
version = "0.1.0"
description = "Open-source, white-label consent vault: a tamper-evident record of who agreed to be contacted."
readme = "README.md"
license = { text = "MIT" }
keywords = ["consent", "compliance", "audit", "tamper-evident", "rfc3161"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
requires-python = ">=3.11"
dependencies = ["psycopg[binary]>=3.1"]

[project.urls]
Homepage = "https://github.com/ndnstyl/consentVault"
Repository = "https://github.com/ndnstyl/consentVault"
Issues = "https://github.com/ndnstyl/consentVault/issues"

[project.optional-dependencies]
# Multi-tenant layer: field encryption and token verification. The single-company core needs none of it.
cloud = ["cryptography>=43"]
dev = ["pytest", "cryptography>=43"]

[project.scripts]
consentvault = "consentvault.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/consentvault"]

[tool.hatch.build.targets.wheel.force-include]
"migrations" = "consentvault/_migrations"

[tool.pytest.ini_options]
testpaths = ["tests"]
# The live self-host tests need the stack running; they run only through tests/selfhost/run_suites.sh
# (or `pytest -o addopts="" tests/selfhost`), where a missing stack fails loudly.
addopts = "--ignore=tests/selfhost -m 'not contract_pending'"
pythonpath = ["src"]
markers = ["contract_pending: executable contract for records, confirmations and setup, written before the implementation; excluded from the default run, run with -m contract_pending until the build starts",
           "network: needs outbound network access (for example a live timestamp authority); deselect with -m \"not network\"",
           "migration_login_check: the start check also refuses the suite's own migration login (every other test keeps it, to act as the owner)"]
